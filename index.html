<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GradWise Finance</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #eef6fb;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 500px;
      margin: 50px auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #0077cc;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #0077cc;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #005fa3;
    }

    #result {
      margin-top: 25px;
      padding: 15px;
      background-color: #f0f9ff;
      border-left: 4px solid #0077cc;
      font-size: 1.1em;
    }

    .note {
      font-size: 0.85em;
      color: #888;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>GradWise Loan Estimator</h1>
    <form id="loanForm">
      <label for="amount">Loan Amount ($)</label>
      <input type="number" id="amount" required />

      <label for="rate">Interest Rate (%)</label>
      <input type="number" id="rate" step="0.01" required />

      <label for="years">Loan Term (years)</label>
      <input type="number" id="years" required />

      <button type="submit">Calculate</button>
    </form>

    <div id="result"></div>
    <div class="note">* Results are estimated. Backend must be running on <code>localhost:4567</code>.</div>
  </div>

  <script>
    document.getElementById('loanForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const amount = parseFloat(document.getElementById('amount').value);
      const rate = parseFloat(document.getElementById('rate').value);
      const years = parseInt(document.getElementById('years').value);

      const response = await fetch('http://localhost:4567/loan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          principal: amount,
          interestRate: rate,
          years: years
        })
      });

      if (!response.ok) {
        document.getElementById('result').innerHTML = "⚠️ Unable to fetch loan data. Make sure the backend is running.";
        return;
      }

      const data = await response.json();
      document.getElementById('result').innerHTML = `
        <strong>Monthly Payment:</strong> $${data.monthlyPayment.toFixed(2)}<br>
        <strong>Total Repayment:</strong> $${data.totalRepayment.toFixed(2)}<br>
        <strong>Total Interest:</strong> $${data.totalInterest.toFixed(2)}
      `;
    });
  </script>
</body>
</html>
